name: Maruf

on:
  workflow_dispatch:
    inputs:
      THE_NAME:
        description: prayer_times_app
        type: string
        required: true

      MAIN_PY:
        description: Python main filename
        type: string
        required: true
        default: maruf.py

      #NO_WINDOWS:
      #  description: Do not build for Windows, just Linux
      #  type: boolean
      #  required: true
      #  default: false
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check-out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13' # Version range or exact version of a Python version to use, using SemVer's version range syntax
          architecture: 'x64' # optional x64 or x86. Defaults to x64 if not specified
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Get site-packages path
        id: site
        run: echo "SITE_PACKAGES=$(python -c 'import site; print(site.getsitepackages()[0])')" >> $GITHUB_ENV

      - name: Build Executable
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: maruf.py
          mode: onefile
          enable-plugins: pyside6
          args: "--include-data-files=${{ env.SITE_PACKAGES }}/timezonefinder/*.bin=timezonefinder/"
          include-data-dir: |
            ${{ env.SITE_PACKAGES }}/numpy=numpy
            ${{ env.SITE_PACKAGES }}/timezonefinder=timezonefinder

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }} Build
          path: |
            build/*.exe
            build/*.bin
            build/*.app/**/*
            build/*.dist/**/*
          include-hidden-files: true
